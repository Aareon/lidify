# GPU-enabled build + deploy for Unraid, driven from VS Code (.vscode/tasks.json).
#
# Builds the all-in-one image (with the CUDA 11 runtime wheels added in
# Dockerfile) on the Unraid Docker daemon over an SSH docker context, then runs
# it with the GPU attached. This is the source of truth for the GPU deployment;
# the repo's other docker-compose*.yml files pull prebuilt registry images.
#
# Usage (from VS Code):
#   1. Run task "Unraid: create docker context" once.
#   2. Run task "Deploy to Unraid" (Ctrl/Cmd+Shift+B) after any code change.
#
# Secrets/overrides come from a local .env next to this file, e.g.:
#   OPENROUTER_API_KEY=sk-or-...
#   MUSIC_PATH=/mnt/user/media/music
#   LIDIFY_APPDATA=/mnt/user/appdata/lidify
#   LIDIFY_CALLBACK_URL=http://10.0.0.200:3030
services:
  # One-shot: create + chmod the bind-mounted appdata subdirs (redis/postgres)
  # before Lidify starts. Redis won't create its own data dir and fails without
  # this on a fresh Unraid appdata folder (owned root:root). See project memory.
  init-permissions:
    image: alpine:latest
    container_name: lidify-init-permissions
    volumes:
      - ${LIDIFY_APPDATA:-/mnt/user/appdata/lidify}:/data
      - ${LIDIFY_DOWNLOADS:-/mnt/user/downloads/lidify}:/downloads
      # slskd's app/config/db dir — must be writable by uid 1000 (slskd runs as 1000:1000).
      - ${SLSKD_APPDATA:-/mnt/user/appdata/slskd}:/slskd-data
    # Also create+chmod the downloads dir so the app (uid 1000) can write track
    # downloads there. Without this, mkdir under /downloads fails with EACCES.
    command: ["sh", "-c", "mkdir -p /data/redis /data/postgres /downloads /slskd-data && chmod -R 777 /data && chmod 777 /downloads /slskd-data"]
    restart: "no"

  lidify:
    build:
      context: .
      dockerfile: Dockerfile
    image: lidify:cuda
    container_name: lidify
    # Attach the NVIDIA GPU (Essentia/TensorFlow mood analysis). Requires the
    # Unraid Nvidia Driver plugin and an image built from this Dockerfile.
    runtime: nvidia
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    ports:
      - "${PORT:-3030}:3030"
    volumes:
      - ${MUSIC_PATH:-/mnt/user/media/music}:/music
      - ${LIDIFY_APPDATA:-/mnt/user/appdata/lidify}:/data
      # Downloaded tracks (Soulseek / YouTube). Must be a real, writable mount —
      # the downloadPath setting (/downloads) points here. See KNOWN_ISSUES.md.
      - ${LIDIFY_DOWNLOADS:-/mnt/user/downloads/lidify}:/downloads
    environment:
      - TZ=${TZ:-America/Chicago}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # GPU: ONE analyzer worker only. Each worker opens its own TF/CUDA context
      # and multiple contexts OOM a small card. TF_FORCE_GPU_ALLOW_GROWTH is
      # ignored by Essentia (MTG/essentia #1432) so there is no per-process cap.
      # Raise to 2-4 only if you revert to a CPU-only image. See KNOWN_ISSUES.md.
      - NUM_WORKERS=${NUM_WORKERS:-1}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Must be defined (any value): supervisord interpolates %(ENV_SOULSEEK_DEBUG)s
      # in the backend program block and aborts if the var is unset. "true" enables
      # verbose Soulseek scoring logs; anything else is off.
      - SOULSEEK_DEBUG=${SOULSEEK_DEBUG:-false}
      # Real LAN IP of the Unraid host so Lidarr (a different container) can
      # reach Lidify's webhook. host.docker.internal only resolves inside Lidify.
      - LIDIFY_CALLBACK_URL=${LIDIFY_CALLBACK_URL:-http://10.0.0.200:3030}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  # slskd — the Soulseek engine for SHARING (and, after the cutover, downloads).
  # soulseek-ts (inside Lidify) is download-only and can't serve files or be
  # searchable; slskd handles search visibility, browse, and uploads. It logs in
  # with the SAME Soulseek account, so once this is running, Lidify's own
  # soulseek-ts must stop logging in (the network allows one client per account)
  # — that cutover follows in a later change. See KNOWN_ISSUES.md / project memory.
  #
  # Lidify reaches slskd's REST API over the internal compose network at
  # http://slskd:5030 — the API/UI is intentionally NOT published to the LAN
  # (SLSKD_NO_AUTH is safe only because it's unreachable from outside this network).
  #
  # First boot needs credentials from the host .env next to this file:
  #   SLSKD_SLSK_USERNAME=your_soulseek_user
  #   SLSKD_SLSK_PASSWORD=your_soulseek_pass
  # (After the cutover, Lidify pushes credential changes to slskd via its API so
  # saving them in the web app applies immediately without a redeploy.)
  slskd:
    image: slskd/slskd:latest
    container_name: lidify-slskd
    # Run as uid:gid 1000 so it can read /music and write /downloads + /app,
    # matching how the Lidify container already accesses those mounts.
    user: "1000:1000"
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    ports:
      # Soulseek listen port. For full search visibility on the network, forward
      # this port to the Unraid host on your router. Nothing else must be public.
      - "${SLSKD_LISTEN_PORT:-50300}:50300"
      # Web UI / REST API is deliberately NOT published — Lidify talks to it over
      # the internal compose network. Uncomment (and set web auth) to expose the UI:
      # - "${SLSKD_PORT:-5030}:5030"
    volumes:
      # Config + database + logs (persistent).
      - ${SLSKD_APPDATA:-/mnt/user/appdata/slskd}:/app
      # The library to share — read-only; sharing only ever reads.
      - ${MUSIC_PATH:-/mnt/user/media/music}:/music:ro
      # Same downloads mount Lidify scans, so slskd-fetched tracks land where
      # Lidify already looks (used once downloads are cut over to slskd).
      - ${LIDIFY_DOWNLOADS:-/mnt/user/downloads/lidify}:/downloads
    environment:
      - TZ=${TZ:-America/Chicago}
      # NOTE: Soulseek credentials are intentionally NOT set here. Lidify pushes
      # them into slskd's live config via the API (remote configuration) when you
      # save them in the web app, so they apply immediately. slskd's precedence is
      # env > yaml, so setting SLSKD_SLSK_USERNAME/PASSWORD here would shadow that.
      - SLSKD_SLSK_LISTEN_PORT=50300
      - SLSKD_SHARED_DIR=/music
      - SLSKD_DOWNLOADS_DIR=/downloads
      # Let Lidify update credentials/shares via the API.
      - SLSKD_REMOTE_CONFIGURATION=true
      # No web auth: the API is only reachable inside this compose network.
      - SLSKD_NO_AUTH=true
    restart: always
